<!DOCTYPE html>
<html>
<head>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-size: 14px;
      background: #ffffff;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 16px;
      font-weight: 600;
    }
    p {
      margin: 0 0 12px 0;
      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }
    textarea {
      width: 100%;
      min-height: 300px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: 'SF Mono', Monaco, 'Courier New', monospace;
      font-size: 11px;
      resize: vertical;
      margin-bottom: 12px;
    }
    textarea:focus {
      outline: none;
      border-color: #18a0fb;
    }
    .buttons {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .primary {
      background: #18a0fb;
      color: white;
    }
    .primary:hover {
      background: #0d8ce8;
    }
    .primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .secondary {
      background: #f0f0f0;
      color: #333;
    }
    .secondary:hover {
      background: #e0e0e0;
    }
    .example {
      background: #f8f8f8;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 11px;
    }
    .example code {
      display: block;
      white-space: pre;
      overflow-x: auto;
      color: #0066cc;
    }
    .status {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }
    .status.success {
      background: #e6f7e6;
      color: #1e7d1e;
      display: block;
    }
    .status.error {
      background: #ffe6e6;
      color: #c92a2a;
      display: block;
    }
  </style>
</head>
<body>
  <h2>🎨 Claude Diagram Importer</h2>
  <p>Paste the diagram specification JSON generated by Claude below:</p>

  <textarea id="spec-input" placeholder='Paste your diagram specification here...

Example:
{
  "title": "My Diagram",
  "nodes": [
    {
      "id": "node1",
      "type": "sticky",
      "label": "Start",
      "x": 100,
      "y": 100
    }
  ],
  "connections": []
}'></textarea>

  <div class="buttons">
    <button class="primary" id="import-btn">Import Diagram</button>
    <button class="secondary" id="cancel-btn">Cancel</button>
  </div>

  <div id="status" class="status"></div>

  <script>
    const specInput = document.getElementById('spec-input');
    const importBtn = document.getElementById('import-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const status = document.getElementById('status');

    importBtn.onclick = () => {
      const specText = specInput.value.trim();

      if (!specText) {
        showStatus('Please paste a diagram specification', 'error');
        return;
      }

      try {
        JSON.parse(specText); // Validate JSON
        importBtn.disabled = true;
        importBtn.textContent = 'Importing...';

        parent.postMessage({
          pluginMessage: {
            type: 'import-diagram',
            spec: specText
          }
        }, '*');
      } catch (error) {
        showStatus('Invalid JSON: ' + error.message, 'error');
      }
    };

    cancelBtn.onclick = () => {
      parent.postMessage({
        pluginMessage: { type: 'cancel' }
      }, '*');
    };

    function showStatus(message, type) {
      status.textContent = message;
      status.className = 'status ' + type;

      if (type === 'success') {
        setTimeout(() => {
          status.style.display = 'none';
        }, 3000);
      }
    }

    onmessage = (event) => {
      const msg = event.data.pluginMessage;

      if (msg.type === 'import-success') {
        showStatus('✅ Diagram imported successfully!', 'success');
        importBtn.disabled = false;
        importBtn.textContent = 'Import Diagram';
        specInput.value = '';
      } else if (msg.type === 'import-error') {
        showStatus('❌ Error: ' + msg.error, 'error');
        importBtn.disabled = false;
        importBtn.textContent = 'Import Diagram';
      }
    };
  </script>
</body>
</html>
